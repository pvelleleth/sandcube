name: Tests
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sandcube
          POSTGRES_PASSWORD: sandcube
          POSTGRES_DB: sandcube_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sandcube -d sandcube_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sandcube:sandcube@127.0.0.1:5432/sandcube_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.19.1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: services/containerd-runtime/go.sum
      - run: make test
      - run: make test-package

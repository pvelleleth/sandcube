name: Signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.19.1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: services/containerd-runtime/go.sum
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: make test
      - run: make test-package
      - name: Build static release
        run: |
          version=${GITHUB_REF_NAME#v}
          test "$version" = "$(sed -n 's/^version: //p' shard.yml)"
          docker build -f infra/release.Dockerfile --build-arg VERSION="$version" --output type=local,dest=out .
          mkdir -p dist
          mv out/sandcube dist/sandcube-linux-${{ matrix.arch }}
          dist/sandcube-linux-${{ matrix.arch }} version
      - uses: actions/upload-artifact@v4
        with:
          name: sandcube-${{ matrix.arch }}
          path: dist/sandcube-linux-*
  sign:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sandcube-*
          merge-multiple: true
          path: dist
      - name: Sign artifacts
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$keyfile"
          RELEASE_VERSION=${GITHUB_REF_NAME#v} RELEASE_SIGNING_KEY="$keyfile" sh scripts/release.sh
      - name: Publish signed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
